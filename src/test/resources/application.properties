# 3 今だからというのはあるけど、開発を始めた当初からテストを書き始めた場合、create文もまだ用意していないし、

# 変更があったときに、いちいちdata.sqlを書き直す必要がある。

# Entityだけ変えれば、適当に良しなにテストデータのテーブルを作ってくれるから、影響範囲が少ない。

# TDDなどのケースを想定している。

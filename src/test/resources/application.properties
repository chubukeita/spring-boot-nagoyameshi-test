# 実務
# マスタデータだったら共通のpropertiesファイルに記載する。
# 個別のデータだったらテスト毎に指定する。
# テストAのためにINSERT文を一個のテストデータAを作ります。またテストBのためにもう一つ別のテストデータBをINSERT文を作ります。
# では、2番目をとらないといけないですよね。
# テストAのためにテストデータBを拾わないように、またテストBのためにテストデータAを拾わないように制御するのが大変。
# SELECTALLでカウント的にはassertCount=1こういうデータが必要だから、新たに追加したらassertCount=2にする。

# proprtiesとしてできないこともあるから、個別にテストデータを設定することも必要になる。
# like検索、IDマッチ、データ突っ込んだから、今まで1つしかデータ取れなかったのに、途中から2つのデータが取れてくる

# →ほかのテストケースに影響を受けて、テストがやりにくくなることがある。

# なので、マスタデータのように絶対に変えることがない場合は、いいけど、トランザクションデータだったら、まとめてしまうと、他とのテストの兼ね合いで影響が出るから、個別にテストデータを指定する。

# マスタデータは挿入したり削除したりすることはない、変更が絶対に発生しない場合は共通化してテストデータを使う。



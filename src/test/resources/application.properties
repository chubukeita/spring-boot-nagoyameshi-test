# 5/9
# 組み込みDB・in-memory DBは同じ
# spring.sql.init.modeの設定値
# always→src/main/resources配下のschema.sql, data.sqlを常に実行する。なお、どんなDBでもSQLを実行してしまうため、
#  組み込みDBであっても、MySQLであっても、両方でSQLが実行されてしまうのが問題。

# embedded→組み込みDBであれば、SQLを実行する。組み込みDBでなければ、SQLは実行しないため、誤って本番DBを初期化する操作を行うことがない。

# DBには大きく分けて、inmemory DB(組み込みDB、テスト用DB)と、外部DBの2種類がある。
# 以下の状態では、先にSQL(schema.sqlやdata.sql)が実行された後に、
# hibaernate(Entity側、Java側)でテーブルが再度作られることになる

# →結果的に、SQLの結果を上書きすることになり、255文字以上のデータによるエラーが発生してしまう。


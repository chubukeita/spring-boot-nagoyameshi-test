# メンテナンスのしやすさ→Entityでテーブルを作って、data.sqlのところだけSQLからspring.sql.init.data-locations=classpath:data.sqlに書いてあるような形で書いて、あとはjavaの方でテーブルを作ってもらって、
# それをテストデータとして使う方針でいい
# data.sqlの方はあるので、戻そうと思えば戻せると思うので、Entityの方でいいかもしれない。
# INSERT文のデータは255に合わせないといけない。

# Entityでうまくなかったらdata.sqlにしようと思えばいい。
# あくまでControllerのところだけに絞って、長ったらしいところに関してはControllerのテストをdescriptionなどはテスト項目から外すようにする。
# なので宿題としては、schema.sqlでテーブル作るのではなく、Entityで作ったテーブルからテストデータを作っていく。
# propertiesは一つにできそう。
# 個別にデータの設定は必要そう。
# Controllerだけで使うテスト用テーブルが必要。

# Insertでデータを入れようとした場合、Repositoryと競合して、うまくテストデータが追加できない可能性がある。
# →Controllerだけで使うやつが必要
# @をつけてControllerテストで独自でテーブルを作る必要がある。
# ControllerもEntityからテーブルを作る。
# Entityから作ったテーブルにSQL、XMLを読み込せておき、マスタデータとして入れて、テスト毎にテストデータを追加する。


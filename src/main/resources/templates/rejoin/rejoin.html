<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<div th:replace="~{fragment :: meta}"></div>
	<div th:replace="~{fragment :: styles}"></div>
	<title>再入会</title>
</head>

<body>
	<div class="nagoyameshi-wrapper">
		<div th:replace="~{fragment :: header}"></div>

		<main>
			<div class="container pb-5 nagoyameshi-container">
				<div class="row justify-content-center">
					<div class="col-xl-5 col-lg-6 col-md-8">

						<nav class="my-3" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
							<ol class="breadcrumb mb-0">
								<li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
								<li class="breadcrumb-item active" aria-current="page">再入会</li>
							</ol>
						</nav>



						<h3 class="mb-3">
							再入会の方は、メールアドレスを入力するだけでご利用になれます。過去に本アプリで会員登録した時のメールアドレスを入力してください。なお、個人情報に変更のある方は、先に再入会後の個人情報編集フォームから登録情報を更新して下さい。
						</h3>

						<div th:if="${successMessage}" class="alert alert-info">
							<span th:text="${successMessage}"></span>
						</div>

						<div th:if="${errorMessage}" class="alert alert-danger">
							<span th:text="${errorMessage}"></span>
						</div>
						
						<hr class="mb-4">

						<form method="post" th:action="@{/rejoin}" th:object="${rejoinForm}">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

							<div class="form-group mb-3">
								<label class="fw-bold">登録メールアドレス</label>
								<div th:if="${#fields.hasErrors('email')}" id="emailError" class="text-danger small mb-2"
									th:errors="*{email}"></div>
								<input type="email" id="email" class="form-control" th:field="*{email}" required
									placeholder="taro.samurai@example.com">
							</div>

							<div class="d-flex justify-content-center gap-3">
								<button type="submit" id="rejoinButton" class="btn text-white shadow-sm w-50 nagoyameshi-btn">再入会する</button>
								<a th:href="@{/login}" class="btn btn-outline-secondary w-25">ログインへ</a>
							</div>
						</form>

					</div>
				</div>
			</div>
		</main>

		<div th:replace="~{fragment :: footer}"></div>
	</div>

	<div th:replace="~{fragment :: scripts}"></div>
	<script th:src="@{/js/rejoin-validation.js}"></script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<div th:replace="~{fragment :: meta}"></div>
	<div th:replace="~{fragment :: styles}"></div>
	<title>エラー</title>
</head>

<body>
	<div class="nagoyameshi-wrapper">
		<div th:replace="~{fragment :: header}"></div>

		<main>
			<div class="container pb-5 nagoyameshi-container">
				<div class="row justify-content-center">
					<div class="col-xl-6 col-lg-7 col-md-9 text-center">

						<h1 class="my-4 text-center">エラーが発生しました</h1>

						<div th:if="${errorMessage}" class="container nagoyameshi-container my-6">
							<div class="alert alert-danger">
								<span th:text="${errorMessage}"></span>
							</div>
						</div>

						<a th:href="@{/}" class="btn btn-primary shadow-sm">ホームに戻る</a>

					</div>
				</div>
			</div>
		</main>

		<div th:replace="~{fragment :: footer}"></div>
	</div>

	<div th:replace="~{fragment :: scripts}"></div>
</body>

</html>
